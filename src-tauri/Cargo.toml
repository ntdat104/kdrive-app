[package]
name = "kdrive"
version = "2.0.0"
description = "Kdrive desktop: an unlimited cloud drive that stores your files on Discord"
authors = ["ntdat104"]
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin name (needed on Windows).
name = "kdrive_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde_json = "1"
tiny_http = "0.12"
ureq = "2"
url = "2"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[features]
# Used for production builds or when a dev server is not specified. DO NOT REMOVE!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
